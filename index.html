<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Style Transfer</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <!-- ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI Text Style Transfer</h1>
            <p class="subtitle">Generate text in a specific style using a GRU neural network</p>
        </header>
        
        <div class="input-section">
            <label for="seed-text">Enter some text to start with:</label>
            <textarea id="seed-text" rows="4" placeholder="Type your seed text here..."></textarea>
            
            <div class="controls">
                <div class="control-group">
                    <label for="length">Generation length:</label>
                    <input type="number" id="length" min="10" max="500" value="100">
                </div>
                
                <div class="control-group">
                    <label for="temperature">Temperature:</label>
                    <input type="range" id="temperature" min="0.1" max="2" step="0.1" value="0.8">
                    <span id="temp-value">0.8</span>
                </div>
            </div>
            
            <button id="generate-btn" disabled>Loading model...</button>
        </div>
        
        <div class="output-section">
            <h2>Generated Text</h2>
            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Generating text...</p>
            </div>
            <div id="output"></div>
        </div>

        <footer>
            <p>This app runs entirely in your browser using ONNX Runtime Web.</p>
            <p>No data is sent to any server.</p>
            <p><a href="https://github.com/yourusername/TextStyleTransferRNN" target="_blank">View on GitHub</a></p>
        </footer>
    </div>
    
    <script src="assets/js/app.js"></script>
</body>
</html>
